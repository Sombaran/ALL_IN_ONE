# zware-portal - Z-Ware Portal Server
#
# Z-Ware Portal server provides Apache Avro interface for accessing Z-Wave network

description "Z-Ware Portal server"

start on filesystem or runlevel [2345]
stop on runlevel [!2345]

respawn
# Give up if restart occurs 10 times in 30 seconds.
respawn limit 10 30

pre-start script
	if ! initctl status zware-ldap | grep -q "start/running" ; then
		if ! (initctl start zware-ldap \
				&& sleep 1 \
				&& initctl status zware-ldap | grep -q "start/running") ; then
			logger -is -t "$UPSTART_JOB" "ERROR: Failed to start dependent service - zware-ldap!"
			exit 1
		fi
	fi
end script

script
	base_path="/home/sigma/zwportal"
	path_list=""

	for path in `cat "${base_path}/library-path.list"` ; do
		path_list="${path_list}${base_path}/install/${path}:"
	done
	for item in `cat "${base_path}/zwportald-env-variable.list"` ; do
		var_name=`echo $item |cut -d'=' -f1`
		var_value=`echo $item |cut -d'=' -f2`
		env ${var_name}="${base_path}/install/${var_value}"
		export ${var_name}
	done
	
	LD_LIBRARY_PATH="${path_list}:${LD_LIBRARY_PATH}" \
	exec "${base_path}/install/zwportald/bin/zwportald" -f "${base_path}/install/zwportald/etc/zwportald.conf" \
		>> "${base_path}/install/zwportald/var/log/zwportald.log" 2>&1
end script
