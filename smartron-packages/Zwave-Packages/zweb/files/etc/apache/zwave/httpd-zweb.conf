# WARNING: This configuration file is generated by Z-Ware Portal system. Any direct
# changes to this file shall be lost in subsequent installation or configuration of
# this software.

Listen 8080

#SSLSessionCache "shmcb:/var/zweb/logs/ssl_scache(512000)"

<VirtualHost *:8080>
	ServerName zware-portal.com

	DocumentRoot "/usr/share/zweb/htdocs"
	ServerAdmin hostmaster@zware-portal.com

	#SSLEngine on
	#SSLSessionCacheTimeout 600
	#SSLCertificateFile "/etc/apache/zwave/ssl.crt/zware-portal.com.crt"
	#SSLCertificateKeyFile "/etc/apache/zwave/ssl.key/zware-portal.com.key"
	#SSLCertificateChainFile "/etc/apache/zwave/ssl.ca.crt/zware-portal.com.ca.crt"

	# Error log for the virtual host
	ErrorLog "/var/log/zweb/error_log"

	# Acccess log for the virtual host
	CustomLog "/var/log/zweb/access_log" combined

	# Apache Rewrite Rules to remove php extensions form URL
	<Directory "/usr/share/zweb/htdocs/register">
		<IfModule rewrite_module>
			RewriteEngine On
			RewriteBase /register/

			RewriteCond %{REQUEST_FILENAME} !-d
			RewriteCond %{REQUEST_FILENAME}\.php -f
			RewriteRule ^(.+)$ $1.php [L,QSA]
		</IfModule>
	</Directory>

	<IfModule alias_module>
		# Alias for CGI/FastCGI scripts
		ScriptAlias /cgi/ "/usr/share/zweb/fcgi-bin/"

		# Alias for admin module (user-resource management)
		Alias /admin "/usr/share/zweb/admin/"
	</IfModule>

	<Directory "/usr/share/zweb/htdocs">
        Options +ExecCGI
		AllowOverride AuthConfig FileInfo Limit
        AddHandler fcgid-script .php
        FCGIWrapper /usr/bin/php-cgi .php
		Order allow,deny
		Allow from all
		Require all granted
	</Directory>

	# Enable SSI for Engg UI
	<Directory "/usr/share/zweb/htdocs/ui/eng/*.shtml">
		Options +Includes
		SetOutputFilter INCLUDES
	</Directory>

	<Directory "/usr/share/zweb/cgi-bin">
		SetHandler cgi-script

		SetEnv PHP_INI_SCAN_DIR "/etc"
		SetEnv ZWARE_INSTALL_PATH "/usr/share/zweb"
		SetEnv ZWARE_PORTAL_RECEIVE_TIMEOUT 15
		SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

		Options +ExecCGI
		AllowOverride None
		Order allow,deny
		Allow from all
		Require all granted
	</Directory>

	# FastCGI Configurations
	FcgidInitialEnv ZWARE_INSTALL_PATH "/usr/share/zweb"
	FcgidInitialEnv ZWARE_PORTAL_RECEIVE_TIMEOUT 15

	<Directory "/usr/share/zweb/fcgi-bin">
		SetHandler fcgid-script

		SetEnv PHP_INI_SCAN_DIR "/etc"
		SetEnv ZWARE_INSTALL_PATH "/usr/share/zweb"
		SetEnv ZWARE_PORTAL_RECEIVE_TIMEOUT 15
		SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

		Options +ExecCGI
		AllowOverride None
		Order allow,deny
		Allow from all
		Require all granted
	</Directory>

	<Directory "/usr/share/zweb/admin">
		AllowOverride None
		Order allow,deny
		Allow from all
		Require all granted
	</Directory>

	<IfModule php5_module>
		PHPIniDir "/etc"

		AddType application/x-httpd-php .php
		AddType application/x-httpd-php-source .phps
		AddHandler php5-script .php

		<IfModule dir_module>
			DirectoryIndex index.php index.html
		</IfModule>
	</IfModule>
</VirtualHost>

